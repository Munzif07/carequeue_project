name: carequeue
description: CareQueue — Clinic Token Management System

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests → Node.js API
  http: ^1.1.0

  # Save login session locally
  shared_preferences: ^2.2.0

  # Google Fonts (Nunito)
  google_fonts: ^6.1.0

  # App icon
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1a6b5a"
  adaptive_icon_foreground: "assets/images/icon_fg.png"
